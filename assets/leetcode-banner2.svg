<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-labelledby="t d"><title id="t">Mohit Suthar - LeetCode profile banner</title><desc id="d">LeetCode themed banner with profile card for IQ4F840Csl and an animated sliding window over an array.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#121212"/><stop offset=".55" stop-color="#1c1710"/><stop offset="1" stop-color="#14171f"/></linearGradient>
<radialGradient id="gA" cx=".12" cy=".5" r=".45"><stop offset="0" stop-color="#FFA116" stop-opacity=".30"/><stop offset="1" stop-color="#FFA116" stop-opacity="0"/></radialGradient>
<radialGradient id="gB" cx=".9" cy=".45" r=".4"><stop offset="0" stop-color="#ff6b3d" stop-opacity=".16"/><stop offset="1" stop-color="#ff6b3d" stop-opacity="0"/></radialGradient>
<linearGradient id="gr" x1="0" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="repeat"><stop offset="0" stop-color="#FFA116"/><stop offset=".5" stop-color="#ffd58a"/><stop offset="1" stop-color="#FFA116"/>
<animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="600 0" dur="6s" repeatCount="indefinite"/></linearGradient>
<linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFA116"/><stop offset="1" stop-color="#ff6b3d"/></linearGradient>
<linearGradient id="av" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb23e"/><stop offset="1" stop-color="#b86a00"/></linearGradient>
<linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".7"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity=".5"/></filter>
<clipPath id="card"><rect width="1280" height="300" rx="18"/></clipPath>
<clipPath id="nameClip"><text x="300" y="150" class="nm">Mohit Suthar</text></clipPath>
<style>
.sans{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif}
.mono{font-family:'Courier New',Consolas,monospace}
.nm{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif;font-weight:800;font-size:62px;letter-spacing:1px}
.in{animation:in 1s cubic-bezier(.2,.8,.2,1) backwards}
.d1{animation-delay:.1s}.d2{animation-delay:.35s}.d3{animation-delay:.6s}.d4{animation-delay:.85s}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.in,.spin{animation:none}}
</style></defs>
